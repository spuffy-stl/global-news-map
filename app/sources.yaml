# News source taxonomy: continent > region > country > RSS sources.
# - Country `name` MUST match the GeoJSON ADMIN name (used for map markers).
#   Use `label` for a shorter display name.
# - Sources must be LOCAL to the country: outlets based in / primarily serving
#   that country, the kind of thing local readers actually read. English
#   preferred; major national press in the local language is fine where that
#   is what locals read. No pan-regional or international feeds.
# - The crawler fetches each unique feed URL once per run and attributes items
#   to every subscribed country.
# - Validate with: python scripts/validate_feeds.py
